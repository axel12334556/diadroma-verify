<meta name="referrer" content="no-referrer">
<title>Diadroma — Mes clés</title>
<style>
/* Charte Diadroma « itinéraire », identique à celle du site (diadroma-site/style/tokens.css) ; ajout : couleurs d'erreur. */
:root {
  color-scheme: light dark;
  --marine: #0F1E3C;
  --marine-survol: #1B3263;
  --fond: #FBFBFD;
  --fond-2: #F5F5F7;
  --texte: #1D1D1F;
  --texte-doux: #6E6E73;
  --trait: #D2D2D7;
  --lien: #0066CC;
  --menthe: #1FB58F;
  --menthe-texte: #0B7A5E;
  --ambre: #E8920A;
  --ambre-texte: #8A5A00;
  --erreur: #D93025;
  --erreur-texte: #B3261E;
  --nav-fond: rgba(251, 251, 253, .82);
  --police-titre: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --police-texte: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --police-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rayon: 24px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond: #000000;
    --fond-2: #161617;
    --texte: #F5F5F7;
    --texte-doux: #A1A1A6;
    --trait: #3A3A3C;
    --lien: #2997FF;
    --menthe-texte: #2BD0A5;
    --ambre: #F5A524;
    --ambre-texte: #F5A524;
    --erreur: #FF6B63;
    --erreur-texte: #FF6B63;
    --nav-fond: rgba(0, 0, 0, .78);
    --marine: #F5F5F7;
    --marine-survol: #FFFFFF;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { position: relative; margin: 0; font-family: var(--police-texte); color: var(--texte); background: var(--fond); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--lien); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--menthe); outline-offset: 3px; border-radius: 6px; }
h1, h2 { font-family: var(--police-titre); font-weight: 700; letter-spacing: -.025em; line-height: 1.1; text-wrap: balance; }
code { font-family: var(--police-mono); font-size: .9em; }

/* Navigation */
.top { position: sticky; top: 0; z-index: 10; background: var(--nav-fond); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--trait); }
.top .wrap { max-width: 760px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 52px; }
.brand { display: inline-flex; align-items: center; gap: .55rem; color: var(--texte); font-family: var(--police-titre); font-weight: 600; font-size: 1.05rem; letter-spacing: -.01em; }
.brand:hover { text-decoration: none; }
.brand img { width: 28px; height: 28px; display: block; }
.top nav a { color: var(--texte-doux); font-size: .82rem; }
.top nav a:hover { color: var(--texte); text-decoration: none; }

.container { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
h1 { font-size: clamp(2.2rem, 7vw, 3.25rem); margin: 0 0 1rem; }
h2 { font-size: 1.25rem; margin: 2rem 0 .6rem; }
.container > p { color: var(--texte-doux); font-size: 1.05rem; max-width: 38rem; }

/* Tracés d'itinéraire en fond, sur les côtés des grands écrans (comme sur le site) */
.fond { position: absolute; top: 52px; left: 0; right: 0; height: 520px; overflow: hidden; pointer-events: none; display: none; }
.chemin { position: absolute; top: 2rem; width: min(24vw, 340px); height: auto; }
.chemin-g { left: 0; }
.chemin-d { right: 0; }
.chemin path { fill: none; stroke: var(--trait); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.chemin .station { fill: var(--fond); stroke: var(--trait); stroke-width: 6; }
.chemin .arrivee { fill: var(--menthe); stroke: none; }
@media (min-width: 1000px) { .fond { display: block; } }
.container { position: relative; }

/* Dépôt du fichier */
.dropzone { display: block; margin: 2rem 0; padding: 3rem 1.5rem; text-align: center; font-size: 1.1rem; letter-spacing: -.01em; background: var(--fond-2); border: 2px dashed var(--trait); border-radius: var(--rayon); cursor: pointer; transition: border-color .2s, transform .25s cubic-bezier(.2,.8,.2,1), background-color .25s; }
.dropzone span { display: block; margin-top: .3rem; font-size: .9rem; color: var(--texte-doux); }
.dropzone:hover, .dropzone.dragover, .dropzone:focus-within { border-color: var(--menthe); transform: translateY(-2px); }
.dropzone.dragover { transform: scale(1.015); background: color-mix(in srgb, var(--menthe) 8%, var(--fond-2)); }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* Messages : une station colorée devant le texte */
#result:not([hidden]), .banner { position: relative; margin: 1.25rem 0; padding: 1.1rem 1.25rem 1.1rem 3.1rem; background: var(--fond-2); border-radius: var(--rayon); }
#result:not([hidden])::before, .banner::before { content: ""; position: absolute; left: 1.25rem; top: 1.35rem; width: 16px; height: 16px; border-radius: 50%; background: var(--fond); border: 3px solid var(--texte-doux); }
#result.success::before, .banner.success::before { background: var(--menthe); border-color: var(--menthe); }
#result.error::before, .banner.error::before { background: var(--erreur); border-color: var(--erreur); }
#result.pending::before, .banner.pending::before, #result.unsupported::before, .banner.unsupported::before, #result.unsigned::before { background: var(--fond); border-color: var(--ambre); }
.banner strong { font-family: var(--police-titre); font-size: 1.1rem; letter-spacing: -.015em; }
.banner p { margin: .35rem 0 0; color: var(--texte-doux); }

/* Contrôles complémentaires */
.options { margin: 2rem 0; padding: 1.5rem 1.5rem 1.75rem; background: var(--fond-2); border-radius: var(--rayon); }
.options h2 { margin-top: 0; }
.options label { display: block; margin-top: 1.1rem; font-size: .92rem; }
.options input[type=text] { display: block; width: 100%; margin-top: .4rem; padding: .65rem .8rem; font: inherit; font-family: var(--police-mono); font-size: .85rem; color: var(--texte); background: var(--fond); border: 1px solid var(--trait); border-radius: 12px; }
.options input[type=file] { display: block; margin-top: .4rem; max-width: 100%; color: var(--texte-doux); }
.options .check-option { display: flex; gap: .6rem; align-items: flex-start; color: var(--texte-doux); }
/* Boutons : pastilles marine, léger relief au survol, enfoncement au clic */
.options button, #memoryBtn { margin-top: 1.25rem; padding: .7rem 1.5rem; font: inherit; font-weight: 500; color: var(--fond); background: var(--marine); border: 0; border-radius: 980px; cursor: pointer; transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, background-color .18s; }
.options button:hover, #memoryBtn:hover { background: var(--marine-survol); transform: translateY(-2px); box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--marine) 55%, transparent); }
.options button:active, #memoryBtn:active { transform: translateY(0) scale(.97); box-shadow: none; }
.options input[type=file]::file-selector-button { margin-right: .75rem; padding: .45rem 1.05rem; font: inherit; font-size: .88rem; font-weight: 500; color: var(--texte); background: var(--fond); border: 1px solid var(--trait); border-radius: 980px; cursor: pointer; transition: transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s, box-shadow .18s; }
.options input[type=file]::file-selector-button:hover { border-color: var(--menthe); transform: translateY(-2px); box-shadow: 0 8px 18px -10px var(--menthe); }
.options input[type=file]::file-selector-button:active { transform: translateY(0) scale(.97); box-shadow: none; }
.options input[type=text] { transition: border-color .18s, box-shadow .18s; }
.options input[type=text]:focus { outline: none; border-color: var(--menthe); box-shadow: 0 0 0 4px color-mix(in srgb, var(--menthe) 25%, transparent); }
.notice { margin: .8rem 0 0; padding: .8rem 1rem; background: var(--fond); border-radius: 12px; font-size: .9rem; color: var(--texte-doux); }
.notice p { margin: 0; }
#memoryBtn { margin-top: .7rem; padding: .45rem 1.1rem; font-size: .88rem; }

/* Contrôles : un itinéraire d'étapes */
.checks { list-style: none; margin: 1.5rem 0; padding: 0; }
.check { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: .1rem .7rem; padding: .85rem 0; border-bottom: 1px solid var(--trait); }
.check .mark { font-weight: 700; }
.check .label { letter-spacing: -.01em; }
.check .state { font-size: .82rem; font-weight: 600; }
.check .detail { grid-column: 2 / 4; font-size: .85rem; color: var(--texte-doux); overflow-wrap: anywhere; }
.check.pass .mark, .check.pass .state { color: var(--menthe-texte); }
.check.fail .mark, .check.fail .state { color: var(--erreur-texte); }
.check.skipped .mark, .check.skipped .state { color: var(--ambre-texte); }
.limits { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--trait); font-size: .92rem; color: var(--texte-doux); }
.limits h2 { color: var(--texte); font-size: 1.1rem; }

/* Contenu du DBoM en clair, affiché seulement s'il correspond à la preuve */
.dbom { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--trait); }
.dbom h2 { margin-top: 0; }
.dbom h3 { font-family: var(--police-titre); font-size: 1.05rem; letter-spacing: -.01em; margin: 1.75rem 0 .5rem; }
.dbom-note { color: var(--texte-doux); font-size: .92rem; margin: .4rem 0; }
.dbom-rows { margin: 0; }
.dbom-rows > div { display: grid; grid-template-columns: minmax(8rem, 14rem) 1fr; gap: .25rem 1rem; padding: .55rem 0; border-bottom: 1px solid var(--trait); }
.dbom-rows dt { color: var(--texte-doux); font-size: .9rem; }
.dbom-rows dd { margin: 0; overflow-wrap: anywhere; }
.dbom-scroll { overflow-x: auto; }
.dbom table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.dbom th { text-align: left; font-weight: 600; color: var(--texte-doux); font-size: .82rem; padding: .5rem .75rem .5rem 0; border-bottom: 1px solid var(--trait); white-space: nowrap; }
.dbom td { padding: .6rem .75rem .6rem 0; border-bottom: 1px solid var(--trait); vertical-align: top; }
@media (max-width: 560px) { .dbom-rows > div { grid-template-columns: 1fr; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } .options button:hover, #memoryBtn:hover, .dropzone:hover, .options input[type=file]::file-selector-button:hover { transform: none; } }

/* Rapport exportable : boutons à l'écran, mise en page propre à l'impression (sans le contenu du DBoM) */
.print-only { display: none; }
.report-actions { margin: 1.5rem 0; }
.report-actions button { margin: 0 .75rem .5rem 0; padding: .7rem 1.5rem; font: inherit; font-weight: 500; color: var(--fond); background: var(--marine); border: 0; border-radius: 980px; cursor: pointer; }
.report-actions button:hover { background: var(--marine-survol); }
@media print {
  .fond, .top, .dropzone, #result, #v2bOptions, #dbomView, #disclosureReport, #reportActions { display: none !important; }
  .print-only { display: block; }
  body { background: #fff; color: #000; }
  .check, .banner, .limits { break-inside: avoid; }
  .dbom-rows dd { overflow-wrap: anywhere; }
}

/* Outil de clés : ajouts propres à cet outil. Le style de base (tokens, navigation, tracés de fond, messages « station », cartes
 * grises, boutons pastille) vient de style/tokens.css et style/style.css, les mêmes que le vérificateur : cette feuille n'en
 * redéfinit rien d'autre que ce qui manque à des écrans à formulaires. */
h1:focus { outline: none; }
.top nav { color: var(--texte-doux); font-size: .82rem; }
.brand .logo { width: 28px; height: 28px; display: block; }
.notes { padding-bottom: 0; }
.notes + .container { padding-top: 1.5rem; }
.foot { padding-top: 1.5rem; padding-bottom: 3rem; border-top: 1px solid var(--trait); color: var(--texte-doux); font-size: .85rem; }
.foot p { margin: 0 0 .5rem; font-size: .85rem; }
.muted { color: var(--texte-doux); font-size: .92rem; }
.help { color: var(--texte-doux); font-size: .88rem; margin: .3rem 0 0; }
.row { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; margin: 1.25rem 0 0; }
.row .primary, .row button { margin-top: 0; }

/* Écran d'accueil : trois grandes cartes cliquables, comme la zone de dépôt du vérificateur */
.choices { display: grid; gap: 1rem; margin: 1.75rem 0; }
.choice { display: block; width: 100%; text-align: left; padding: 1.4rem 1.5rem; font: inherit; color: var(--texte); background: var(--fond-2); border: 2px solid transparent; border-radius: var(--rayon); cursor: pointer; transition: border-color .18s, transform .18s cubic-bezier(.2,.8,.2,1); }
.choice b { display: block; font-family: var(--police-titre); font-size: 1.15rem; letter-spacing: -.015em; }
.choice span { display: block; margin-top: .2rem; font-size: .92rem; color: var(--texte-doux); }
.choice:hover, .choice:focus-visible { border-color: var(--menthe); transform: translateY(-2px); }

/* Formulaires : les champs du vérificateur, étendus aux mots de passe et aux cases à cocher */
.options input[type=password] { display: block; width: 100%; margin-top: .4rem; padding: .65rem .8rem; font: inherit; font-family: var(--police-mono); font-size: .85rem; color: var(--texte); background: var(--fond); border: 1px solid var(--trait); border-radius: 12px; transition: border-color .18s, box-shadow .18s; }
.options input[type=password]:focus { outline: none; border-color: var(--menthe); box-shadow: 0 0 0 4px color-mix(in srgb, var(--menthe) 25%, transparent); }
.options label.inline { display: flex; gap: .6rem; align-items: flex-start; color: var(--texte-doux); }
.options input[type=checkbox] { margin-top: .25rem; flex: none; }
.options > form > p { color: var(--texte-doux); max-width: none; font-size: .95rem; }
.options button.link, button.link { margin: 0; padding: 0; font: inherit; font-size: .92rem; color: var(--lien); background: none; border: 0; border-radius: 0; text-decoration: underline; cursor: pointer; box-shadow: none; transform: none; }
.options button.link:hover, button.link:hover { background: none; box-shadow: none; transform: none; text-decoration: none; }
.options button[disabled], button.primary[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
button.primary { margin-top: 1.25rem; padding: .7rem 1.5rem; font: inherit; font-weight: 500; color: var(--fond); background: var(--marine); border: 0; border-radius: 980px; cursor: pointer; transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, background .18s; }
button.primary:hover { background: var(--marine-survol); transform: translateY(-2px); box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--marine) 55%, transparent); }
button.primary:active { transform: translateY(0) scale(.97); box-shadow: none; }
.banner p { max-width: none; }
.options .banner { background: var(--fond); }   /* a message inside a grey card stands out in white */

/* La phrase secrète : un bloc simple de la carte grise, pas un cadre à part */
.phrase { margin: 1.25rem 0 .4rem; padding: 1.25rem 1.5rem; font-family: var(--police-mono); font-size: 1.2rem; line-height: 1.6; background: var(--fond-2); border: 1px solid var(--trait); border-radius: var(--rayon); overflow-wrap: anywhere; user-select: all; }

/* Étapes : un itinéraire, comme les contrôles du vérificateur */
ol.steps { list-style: none; display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; margin: 0 0 1.5rem; padding: 0; font-size: .85rem; color: var(--texte-doux); }
ol.steps li { display: flex; align-items: center; gap: .5rem; }
ol.steps li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--fond); border: 3px solid var(--trait); }
ol.steps li.done { color: var(--menthe-texte); }
ol.steps li.done::before { background: var(--menthe); border-color: var(--menthe); }
ol.steps li.current { color: var(--texte); font-weight: 600; }
ol.steps li.current::before { border-color: var(--marine); }

/* Faits et fiche : des lignes séparées par un trait fin, comme le contenu du DBoM */
dl.facts { margin: 1.25rem 0; }
dl.facts > div { display: grid; grid-template-columns: minmax(8rem, 15rem) 1fr; gap: .25rem 1rem; padding: .55rem 0; border-bottom: 1px solid var(--trait); }
dl.facts dt { color: var(--texte-doux); font-size: .9rem; }
dl.facts dd { margin: 0; font-family: var(--police-mono); font-size: .85rem; overflow-wrap: anywhere; }
.sheet { margin: 1.25rem 0; padding: 1.5rem 1.5rem 1.25rem; background: var(--fond-2); border-radius: var(--rayon); }
.sheet h2 { margin-top: 0; }
ul.checklist { list-style: none; padding: 0; margin: 1rem 0 0; }
ul.checklist li { padding: .3rem 0; }
.container > ul { color: var(--texte-doux); padding-left: 1.2rem; }
.container > ul b { color: var(--texte); }
@media (max-width: 560px) { dl.facts > div { grid-template-columns: 1fr; } }

@media (prefers-reduced-motion: reduce) { .choice, button.primary { transition: none !important; } .choice:hover, button.primary:hover { transform: none; } }

/* Impression : seule la fiche de récapitulatif, jamais un secret */
@media print {
  body * { visibility: hidden; }
  #fiche, #fiche * { visibility: visible; }
  #fiche { position: absolute; left: 0; top: 0; width: 100%; background: none; }
  :root { color-scheme: light; }
}
@media (max-width: 560px) { .top nav { display: none; } }

</style>
</head>

<header class="top"><div class="wrap"><span class="brand"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="14" fill="#0F1E3C"/><path d="M10 44H24L36 32H54" fill="none" stroke="#F5F7FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="44" r="6" fill="#0F1E3C" stroke="#F5F7FA" stroke-width="4"/><circle cx="36" cy="32" r="6" fill="#0F1E3C" stroke="#F5F7FA" stroke-width="4"/><circle cx="54" cy="32" r="7" fill="#1FB58F"/></svg><span id="brand"></span></span><nav><span id="tagline"></span></nav></div></header>
<div class="fond" aria-hidden="true">
<svg class="chemin chemin-g" focusable="false" viewBox="0 0 360 300" preserveAspectRatio="xMinYMin meet"><path d="M-10 250H110L190 170H300"/><path d="M-10 290H90L170 210H240"/><circle class="station" cx="300" cy="170" r="10"/></svg>
<svg class="chemin chemin-d" focusable="false" viewBox="0 0 360 300" preserveAspectRatio="xMaxYMin meet"><path d="M370 120H250L170 200H80"/><path d="M370 40H300L250 90H200"/><circle class="arrivee" cx="80" cy="200" r="11"/></svg>
</div>
<noscript><main class="container"><p>Cet outil a besoin de JavaScript pour fonctionner dans votre navigateur, sans connexion. / This tool needs JavaScript.</p></main></noscript>
<main class="container" id="app"></main>
<footer class="container foot" id="footer"></footer>
<script>
/* ChainDBoM — création des clés du client (lot 1 : module pur, sans interface, sans réseau, sans dépendance).
 *
 * Produit, en mémoire, EXACTEMENT les trois fichiers que crée `dbom_v2_seal keygen` et la fiche de clé de
 * `key_card create` (format chaindbom-key-card-v1) : client.json, signing.pem (Ed25519, PKCS#8), age-identity.txt
 * (X25519, format age), key-card.json. Rien n'est écrit ni envoyé : l'appelant décide quoi faire des octets.
 *
 * Aucune cryptographie n'est réécrite ici : les clés viennent de WebCrypto (Ed25519, X25519) ; seul l'encodage
 * Bech32 de l'identité age est implémenté, et il est vérifié contre l'outil age lui-même (tests/keys-core.test.cjs).
 * Le chiffrement par phrase secrète (sauvegarde) n'est pas dans ce lot. */
(function (root) {
  'use strict';
  const enc = new TextEncoder();
  const KEY_ID = /^[A-Za-z0-9._-]{1,128}$/;
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  const CARD_FORMAT = 'chaindbom-key-card-v1';
  const CARD_DOMAIN = enc.encode('ChainDBoM:v2:key-card\u0000');
  const PKCS8_ED25519_PREFIX = Uint8Array.from([0x30, 0x2e, 0x02, 0x01, 0x00, 0x30, 0x05, 0x06, 0x03, 0x2b, 0x65, 0x70, 0x04, 0x22, 0x04, 0x20]);

  class KeysError extends Error {}

  const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  const subtle = () => {
    if (!root.crypto || !root.crypto.subtle) throw new KeysError("ce navigateur n'offre pas WebCrypto");

      else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
      else if (key === 'value' || key === 'checked' || key === 'disabled' || key === 'hidden') el[key] = value;
      else el.setAttribute(key, value === true ? '' : String(value));
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : String(kid));
    return el;
  }
  const p = (text, cls) => h('p', { class: cls, text });
  const panel = form => h('section', { class: 'options' }, form);   // the verifier's grey rounded card for forms
  // Messages look like the verifier's: a coloured station before the text (success = mint, error = red, pending = amber ring).
  const BANNER = { ok: 'success', err: 'error', warn: 'pending' };
  const notice = (kind, title, text) => h('div', { class: 'banner ' + BANNER[kind], role: kind === 'err' ? 'alert' : 'status' }, title ? h('strong', { text: title }) : null, text ? h('p', { text }) : null);
  const tick = () => new Promise(resolve => root.setTimeout(resolve, 30));   // let the browser paint before heavy work

  function show(title, ...content) {
    main.replaceChildren(h('h1', { id: 'title', tabindex: '-1', text: title }), ...content);
    const heading = doc.getElementById('title');
    if (heading) heading.focus();
  }
  function download(name, data, type) {
    const url = root.URL.createObjectURL(new root.Blob([data], { type }));
    const link = h('a', { href: url, download: name });
    doc.body.append(link); link.click(); link.remove();
    root.setTimeout(() => root.URL.revokeObjectURL(url), 2000);
  }
  const downloadText = (name, text) => download(name, text, 'text/plain;charset=utf-8');

  function frenchError(error) {
    const E = T.errors, m = String((error && error.message) || '');
    if (error instanceof K.KeysError) return m;
    if (!(error instanceof B.BackupError)) return E.generic;
    if (/not a passphrase-protected age file/.test(m)) return E.wrongFile;
    if (/wrong passphrase/.test(m)) return E.wrongPhrase;
    if (/unsupported scrypt cost/.test(m)) return E.wrongCost;
    if (/do not match the published key card/.test(m)) return E.cardMismatch;
    if (/key card/.test(m)) return E.cardInvalid;
    if (/phrase secrète/.test(m)) return m;
    return E.keysBroken;
  }

  // ---- reading what the person chose ----
  async function readFile(input, max) {
    const file = input.files && input.files[0];
    if (!file) throw new Error(T.errors.noFile);
    if (file.size > max) throw new Error(T.errors.fileTooBig);
    return new Uint8Array(await file.arrayBuffer());
  }
  async function readCard(input) {
    if (!input || !input.files || !input.files[0]) return undefined;
    try { return JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(await readFile(input, MAX_CARD))); }
    catch (error) { throw new Error(error.message === T.errors.fileTooBig ? error.message : T.errors.cardUnreadable); }
  }

  // ---- reusable pieces ----
  function field(id, label, input, help) { return [h('label', { for: id, text: label }), input, help ? h('p', { class: 'help', text: help }) : null]; }
  function passwordField(id, label, showLabel) {
    const input = h('input', { id, type: 'password', autocomplete: 'off', spellcheck: 'false', autocapitalize: 'none' });
    const toggle = h('input', { type: 'checkbox', id: id + '-show', onchange: () => { input.type = toggle.checked ? 'text' : 'password'; } });
    return { input, nodes: [h('label', { for: id, text: label }), input, h('label', { class: 'inline', for: id + '-show' }, toggle, showLabel)] };
  }
  function steps(current) {
    return h('ol', { class: 'steps', 'aria-label': T.create.title },
      T.create.steps.map((text, i) => h('li', { class: i < current ? 'done' : i === current ? 'current' : '', 'aria-current': i === current ? 'step' : null, text })));
  }
  function facts(rows) { return h('dl', { class: 'facts' }, rows.map(([k, v]) => h('div', {}, h('dt', { text: k }), h('dd', { text: v })))); }
  function errorBox() { return h('div', { id: 'problem', 'aria-live': 'assertive' }); }
  function setProblem(text) { const box = doc.getElementById('problem'); box.replaceChildren(text ? notice('err', null, text) : ''); }
  async function busy(button, message, work) {
    const status = doc.getElementById('busy');
    button.disabled = true; status.textContent = message; setProblem('');
    await tick();
    try { return await work(); } finally { button.disabled = false; status.textContent = ''; }
  }
  const busyBox = () => h('p', { id: 'busy', class: 'muted', role: 'status', 'aria-live': 'polite' });
  const dateStamp = d => d.toISOString().slice(0, 10);

  // ---- home ----
  function home() {
    state = null;
    show(T.home.title, p(T.home.intro), notice('warn', null, T.home.warning),
      h('div', { class: 'choices' },
        [['create', createForm], ['verify', () => checkScreen('verify')], ['restore', () => checkScreen('restore')]].map(([key, go]) =>
          h('button', { class: 'choice', type: 'button', 'data-action': key, onclick: go }, h('b', { text: T.home[key] }), h('span', { text: T.home[key + 'Hint'] })))));
  }

  // ---- create: 1. form ----
  function createForm() {
    const now = new Date(), month = now.toISOString().slice(0, 7);
    const responsible = h('input', { type: 'checkbox', id: 'responsible' });
    const signing = h('input', { type: 'text', id: 'signing-id', value: 'sign-' + month, autocomplete: 'off', spellcheck: 'false' });
    const recipient = h('input', { type: 'text', id: 'recipient-id', value: 'age-' + month, autocomplete: 'off', spellcheck: 'false' });
    const submit = h('button', { class: 'primary', type: 'submit', text: T.create.submit });
    const form = h('form', { novalidate: true, onsubmit: async event => {
      event.preventDefault();
      if (!responsible.checked) return setProblem(T.create.responsible);
      if (!KEY_ID.test(signing.value) || !KEY_ID.test(recipient.value)) return setProblem(T.create.idInvalid);
      await busy(submit, T.create.working, async () => {
        try {
          const keys = await K.generateClientKeys({ signingKeyId: signing.value, recipientKeyId: recipient.value, now: new Date() });
          state = { keys, ids: { signing: signing.value, recipient: recipient.value }, passphrase: null, backup: null, downloaded: false };
          root.onbeforeunload = e => { e.preventDefault(); e.returnValue = ''; };   // the keys exist only in this page until delivered
          createPassphrase();
        } catch (error) { setProblem(T.create.failed + frenchError(error)); }
      });
    } },
    h('label', { class: 'inline' }, responsible, T.create.responsible), p(T.create.responsibleHelp, 'help'),
    field('signing-id', T.create.signingId, signing), field('recipient-id', T.create.recipientId, recipient), p(T.create.idHelp, 'help'),
    errorBox(), h('div', { class: 'row' }, submit), busyBox());
    show(T.create.title, steps(0), panel(form));
  }

  // ---- create: 2. passphrase and backup file ----
  function createPassphrase() {
    let own = false;
    const phraseBox = h('div', { class: 'phrase', id: 'phrase', 'aria-live': 'off' });
    const strength = p('', 'help');
    const ownInput = h('input', { type: 'text', id: 'own-phrase', autocomplete: 'off', spellcheck: 'false', autocapitalize: 'none' });
    const ownBlock = h('div', { hidden: true }, field('own-phrase', T.passphrase.ownLabel, ownInput, T.passphrase.ownHelp));
    const another = h('button', { class: 'link', type: 'button', text: T.passphrase.another });
    const toggle = h('button', { class: 'link', type: 'button', text: T.passphrase.own });
    const written = h('input', { type: 'checkbox', id: 'written' });
    const confirm = h('input', { type: 'text', id: 'confirm', autocomplete: 'off', spellcheck: 'false', autocapitalize: 'none' });
    const submit = h('button', { class: 'primary', type: 'submit', text: T.passphrase.submit });
    const result = h('div', { id: 'backup-result' });
    function draw() {
      const g = B.generatePassphrase();
      state.passphrase = g.passphrase; phraseBox.textContent = g.passphrase; strength.textContent = T.passphrase.strength(g.entropyBits);
    }
    function mode(ownMode) {
      own = ownMode; ownBlock.hidden = !own; phraseBox.hidden = own; another.hidden = own;
      toggle.textContent = own ? T.passphrase.generated : T.passphrase.own;
      if (own) { state.passphrase = null; strength.textContent = ''; ownInput.focus(); } else draw();
      confirm.value = '';
    }
    another.addEventListener('click', draw);
    toggle.addEventListener('click', () => mode(!own));
    const current = () => (own ? ownInput.value : state.passphrase);
    const form = h('form', { novalidate: true, onsubmit: async event => {
      event.preventDefault();
      const phrase = current();
      if (!written.checked || !confirm.value) return setProblem(T.passphrase.confirmNeeded);
      if (confirm.value !== phrase) return setProblem(T.passphrase.mismatch);
      await busy(submit, T.passphrase.working, async () => {
        try {
          const made = await B.backup(state.keys.files, phrase, { now: new Date() });
          state.backup = made; state.passphrase = phrase;
          const name = 'diadroma-sauvegarde-cles-' + state.keys.publicFacts.client_id.slice(0, 8) + '-' + dateStamp(new Date()) + '.age';
          submit.hidden = true;
          for (const el of [written, confirm, ownInput, another, toggle]) el.disabled = true;
          const next = h('button', { class: 'primary', type: 'button', disabled: true, text: T.passphrase.next, onclick: createProof });
          result.replaceChildren(notice('ok', null, T.passphrase.done), h('div', { class: 'row' },
            h('button', { class: 'primary', type: 'button', id: 'download-backup', text: T.passphrase.download, onclick: () => { download(name, made.bytes, 'application/octet-stream'); state.downloaded = true; next.disabled = false; } }), next));
        } catch (error) { setProblem(T.passphrase.failed + frenchError(error)); }
      });
    } },
    p(T.create.createdText), p(T.passphrase.intro), notice('warn', null, T.passphrase.write), phraseBox, strength,
    h('div', { class: 'row' }, another, toggle), ownBlock,
    h('label', { class: 'inline' }, written, T.passphrase.written), field('confirm', T.passphrase.confirmLabel, confirm),
    errorBox(), h('div', { class: 'row' }, submit), busyBox(), result);
    show(T.passphrase.title, steps(1), panel(form));
    draw();
  }

  // ---- create: 3. proof that the backup works ----
  function createProof() {
    state.passphrase = null;   // the person must retype it from the paper: that is part of the proof
    const file = h('input', { type: 'file', id: 'proof-file' });
    const pass = passwordField('proof-phrase', T.proof.phrase, T.proof.show);
    const submit = h('button', { class: 'primary', type: 'submit', text: T.proof.submit });
    const form = h('form', { novalidate: true, onsubmit: async event => {
      event.preventDefault();
      await busy(submit, T.proof.working, async () => {
        try {
          const bytes = await readFile(file, MAX_BACKUP);
          if (!pass.input.value) throw new Error(T.errors.noPhrase);
          await B.restoreTest(bytes, pass.input.value, { card: state.keys.card });
          pass.input.value = '';
          delivery();
        } catch (error) { setProblem((error instanceof B.BackupError || error instanceof K.KeysError ? frenchError(error) + T.errors.hint : error.message)); }
      });
    } }, p(T.proof.intro), field('proof-file', T.proof.file, file), pass.nodes, errorBox(), h('div', { class: 'row' }, submit), busyBox());
    show(T.proof.title, steps(2), panel(form));
  }

  // ---- create: 4. delivery ----
  function delivery() {
    const f = state.keys.publicFacts, ids = state.ids, created = state.keys.card.created_at;
    const backupName = 'diadroma-sauvegarde-cles-' + f.client_id.slice(0, 8) + '-' + dateStamp(new Date()) + '.age';
    const button = (label, name, text) => h('button', { class: 'primary', type: 'button', 'data-file': name, text: T.delivery.download + label, onclick: () => downloadText(name, text) });
    const sheetRows = [[T.delivery.sheetRows.client, f.client_id], [T.delivery.sheetRows.signing, ids.signing], [T.delivery.sheetRows.recipient, ids.recipient],
      [T.delivery.sheetRows.fingerprint, f.signing_key_fingerprint_sha256], [T.delivery.sheetRows.created, created], [T.delivery.sheetRows.backup, backupName]];
    show(T.delivery.title, steps(3), notice('ok', null, T.proof.ok), p(T.delivery.intro),
      h('h2', { text: T.delivery.secretTitle }), notice('warn', null, T.delivery.secretText),
      h('ul', {}, T.delivery.secretFiles.map(([name, what]) => h('li', {}, h('b', { text: name }), ' — ' + what))),
      h('div', { class: 'row' }, T.delivery.secretFiles.map(([name]) => button(name, name, state.keys.files[name]))),
      h('h2', { text: T.delivery.publicTitle }), p(T.delivery.publicText),
      h('div', { class: 'row' }, button(T.delivery.cardFile, T.delivery.cardFile, state.keys.cardText)),
      h('div', { class: 'sheet', id: 'fiche' }, h('h2', { text: T.delivery.sheetTitle + ' — ' + T.brand }), p(T.delivery.sheetText, 'muted'), facts(sheetRows),
        h('ul', { class: 'checklist' }, T.delivery.checklist.map(item => h('li', { text: '☐ ' + item })))),
      h('div', { class: 'row' }, h('button', { class: 'primary', type: 'button', id: 'print', text: T.delivery.print, onclick: () => root.print() })),
      h('div', { class: 'row' }, h('button', { class: 'primary', type: 'button', id: 'finish', text: T.delivery.finish, onclick: finish })), p(T.delivery.finishHelp, 'help'));
  }
  function finish() { state = null; root.onbeforeunload = null; root.location.reload(); }

  // ---- verify / restore ----
  function checkScreen(mode) {
    state = null;
    const restoring = mode === 'restore';
    const file = h('input', { type: 'file', id: 'check-file' });
    const pass = passwordField('check-phrase', T.check.phrase, T.check.show);
    const card = h('input', { type: 'file', id: 'check-card', accept: '.json,application/json' });
    const submit = h('button', { class: 'primary', type: 'submit', text: restoring ? T.check.restoreSubmit : T.check.verifySubmit });
    const out = h('div', { id: 'out' });
    const form = h('form', { novalidate: true, onsubmit: async event => {
      event.preventDefault();
      out.replaceChildren();
      await busy(submit, T.check.working, async () => {
        try {
          const bytes = await readFile(file, MAX_BACKUP);
          if (!pass.input.value) throw new Error(T.errors.noPhrase);
          const options = { card: await readCard(card) };
          const result = restoring ? await B.restore(bytes, pass.input.value, options) : { facts: await B.restoreTest(bytes, pass.input.value, options) };
          pass.input.value = '';
          const x = result.facts;
          out.replaceChildren(...[notice('ok', T.check.okTitle, restoring ? T.check.restoredText : T.check.okText),
            facts([[T.check.facts.client, x.client_id], [T.check.facts.fingerprint, x.signing_key_fingerprint_sha256], [T.check.facts.recipient, x.recipient],
              [T.check.facts.created, x.backup_created_at], [T.check.facts.card, x.key_card_matched ? T.check.cardYes : T.check.cardNo]]),
            restoring ? h('div', { class: 'row' }, T.delivery.secretFiles.map(([name]) => h('button', { class: 'primary', type: 'button', 'data-file': name, text: T.delivery.download + name, onclick: () => downloadText(name, result.files[name]) }))) : null].filter(Boolean));
        } catch (error) { setProblem(error instanceof B.BackupError || error instanceof K.KeysError ? frenchError(error) + T.errors.hint : error.message); }
      });
    } }, p(T.check.intro), field('check-file', T.check.file, file), pass.nodes, field('check-card', T.check.card, card, T.check.cardHelp),
    errorBox(), h('div', { class: 'row' }, submit), busyBox(), out,
    h('div', { class: 'row' }, h('button', { class: 'link', type: 'button', text: T.check.back, onclick: home })));
    show(restoring ? T.check.restoreTitle : T.check.verifyTitle, panel(form));
  }

  // ---- start: can this browser do it at all? ----
  async function supported() {
    try {
      const s = root.crypto.subtle;
      await s.generateKey({ name: 'Ed25519' }, false, ['sign']);
      await s.generateKey({ name: 'X25519' }, false, ['deriveBits']);
      return !!root.AgeEncryption;
    } catch { return false; }
  }
  let started = false;
  async function start() {
    if (started) return;
    started = true;
    doc.title = T.title;
    doc.getElementById('brand').textContent = T.brand;
    doc.getElementById('tagline').textContent = T.tagline + ' — ' + T.version;
    doc.getElementById('footer').replaceChildren(p(T.footer), p(T.privateTip));
    // K4: keys are never created, backed up or checked from a web page: only from the published file opened from the disk.
    if (root.location.protocol !== 'file:') { show(T.home.title, notice('err', null, T.hostedBlocked)); return; }
    if (!await supported()) { show(T.home.title, notice('err', null, T.unsupported)); return; }
    home();
  }
  root.addEventListener('DOMContentLoaded', start);
  if (doc.readyState !== 'loading') start();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
