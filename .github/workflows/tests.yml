name: Vérification hors réseau
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/fail-closed-ui, main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer age (contrôles croisés de la création de clés)
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Création et sauvegarde de clés (modules purs, contrôles croisés avec age, tar et l'outil Python, sans réseau)
        run: |
          REQUIRE_AGE=1 node tests/keys-core.test.cjs
          REQUIRE_AGE=1 node tests/age-vendor.test.cjs
          REQUIRE_AGE=1 node tests/keys-backup.test.cjs
      - name: Tests JavaScript sans réseau
        run: |
          node tests/merkle.test.cjs
          node tests/ots.test.cjs
          node tests/height.test.cjs
          node tests/chain.test.cjs
          node tests/verify.test.cjs
          node tests/v2b.test.cjs
          node tests/v2b-text.test.cjs
          node tests/v2b-real.test.cjs
          node tests/keycard.test.cjs
          node tests/truststore.test.cjs
          node tests/dbomview.test.cjs
          node tests/disclosure.test.cjs
          node tests/report.test.cjs
      - name: Vecteurs v2b identiques au vérificateur Python de référence
        run: |
          python -m pip install cryptography rfc8785
          python tests/tools/gen_v2b_vectors.py --verifier tests/tools/reference/verify_v2b_anchored_proof.py --check
          python tests/tools/gen_keycard_vectors.py --check
          python tests/tools/gen_disclosure_vectors.py --check
          python tests/tools/verify_real_vectors.py
      - name: Tests Python sans réseau
        run: |
          python -m py_compile cli/verify_anchor.py
          python -m unittest discover -s tests -p 'test_cli_height.py' -v
  age-bundle:
    # Reconstruit la bibliothèque age vendorée depuis le verrou npm et exige un résultat identique au fichier commité
    # (réseau : registre npm). Inactif tant que le verrou n'a pas été commité.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconstruire et comparer
        if: ${{ hashFiles('keys/vendor/build/package-lock.json') != '' }}
        run: keys/vendor/build.sh --check
