name: Site public (artefact seulement)
on:
  pull_request:
    branches: [main]
  push:
    branches: [chore/pages-artifact]
permissions:
  contents: read
jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assembler les fichiers autorisés
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/style site/assets
          cp index.html how-it-works.html ots.js ui.js verify.js v2b.js v2b-text.js report.js trust-store.js dbom-view.js site/
          cp style/style.css style/tokens.css site/style/
          cp favicon.svg site/
          cp assets/logo-mark.svg site/assets/
          for file in index.html how-it-works.html ots.js ui.js verify.js v2b.js v2b-text.js report.js trust-store.js dbom-view.js style/style.css style/tokens.css favicon.svg assets/logo-mark.svg; do
            test -s "site/$file"
          done
          diff -u <(printf '%s\n' assets/logo-mark.svg dbom-view.js favicon.svg how-it-works.html index.html ots.js report.js style/style.css style/tokens.css trust-store.js ui.js v2b-text.js v2b.js verify.js) <(find site -type f | sed 's#^site/##' | sort)
          for src in $(grep -o 'src="[^"]*\.js"' index.html | sed 's/src="//; s/"$//'); do
            test -s "site/$src" || { echo "script référencé mais non publié : $src"; exit 1; }
          done
          test ! -e site/cli
          test ! -e site/tests
          # Publish the fingerprint of every served file, so an auditor can compare what the page runs (review V10)
          (cd site && find . -type f ! -name SHA256SUMS | sed 's#^\./##' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
          test -s site/SHA256SUMS
          cat site/SHA256SUMS
      - name: Déposer l'artefact de contrôle (pas de déploiement)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diadroma-site-review
          path: site/
          if-no-files-found: error
          retention-days: 7
