name: Site public (artefact seulement)
on:
  pull_request:
    branches: [main]
  push:
    branches: [chore/pages-artifact]
permissions:
  contents: read
jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assembler les fichiers autorisés
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/style
          cp index.html how-it-works.html ots.js ui.js verify.js site/
          cp style/style.css site/style/
          for file in index.html how-it-works.html ots.js ui.js verify.js style/style.css; do
            test -s "site/$file"
          done
          diff -u <(printf '%s\n' how-it-works.html index.html ots.js style/style.css ui.js verify.js) <(find site -type f | sed 's#^site/##' | sort)
          test ! -e site/cli
          test ! -e site/tests
      - name: Déposer l'artefact de contrôle (pas de déploiement)
        uses: actions/upload-artifact@v4
        with:
          name: diadroma-site-review
          path: site/
          if-no-files-found: error
          retention-days: 7
