name: Publier le vérificateur (manuel)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diadroma-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests JS et Python sans réseau
        run: |
          set -euo pipefail
          node tests/merkle.test.cjs
          node tests/ots.test.cjs
          node tests/height.test.cjs
          node tests/chain.test.cjs
          node tests/verify.test.cjs
          node tests/v2b.test.cjs
          node tests/v2b-text.test.cjs
          node tests/v2b-real.test.cjs
          node tests/keycard.test.cjs
          node tests/truststore.test.cjs
          node tests/dbomview.test.cjs
          node tests/disclosure.test.cjs
          python -m py_compile cli/verify_anchor.py
          python -m unittest discover -s tests -p 'test_cli_height.py' -v
      - name: Assembler uniquement les fichiers autorisés
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/style site/assets
          cp index.html how-it-works.html ots.js ui.js verify.js v2b.js v2b-text.js trust-store.js dbom-view.js site/
          cp style/style.css style/tokens.css site/style/
          cp favicon.svg site/
          cp assets/logo-mark.svg site/assets/
          for file in index.html how-it-works.html ots.js ui.js verify.js v2b.js v2b-text.js trust-store.js dbom-view.js style/style.css style/tokens.css favicon.svg assets/logo-mark.svg; do
            test -s "site/$file"
          done
          diff -u <(printf '%s\n' assets/logo-mark.svg dbom-view.js favicon.svg how-it-works.html index.html ots.js style/style.css style/tokens.css trust-store.js ui.js v2b-text.js v2b.js verify.js) <(find site -type f | sed 's#^site/##' | sort)
          for src in $(grep -o 'src="[^"]*\.js"' index.html | sed 's/src="//; s/"$//'); do
            test -s "site/$src" || { echo "script référencé mais non publié : $src"; exit 1; }
          done
          test ! -e site/cli
          test ! -e site/tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
