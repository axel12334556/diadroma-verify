name: Publier le vérificateur (manuel)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diadroma-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Tests JS et Python sans réseau
        run: |
          set -euo pipefail
          node tests/merkle.test.cjs
          node tests/ots.test.cjs
          node tests/height.test.cjs
          node tests/chain.test.cjs
          node tests/verify.test.cjs
          node tests/v2b.test.cjs
          node tests/v2b-text.test.cjs
          node tests/v2b-limits.test.cjs
          node tests/v2b-hardening.test.cjs
          node tests/v2b-real.test.cjs
          node tests/keycard.test.cjs
          node tests/truststore.test.cjs
          node tests/dbomview.test.cjs
          node tests/disclosure.test.cjs
          node tests/report.test.cjs
          python -m py_compile cli/verify_anchor.py
          python -m unittest discover -s tests -p 'test_cli_height.py' -v
      - name: Assembler uniquement les fichiers autorisés
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/style site/assets
          cp index.html how-it-works.html ots.js ui.js verify.js v2b.js v2b-text.js report.js trust-store.js dbom-view.js site/
          cp style/style.css style/tokens.css site/style/
          cp favicon.svg site/
          cp assets/logo-mark.svg site/assets/
          for file in index.html how-it-works.html ots.js ui.js verify.js v2b.js v2b-text.js report.js trust-store.js dbom-view.js style/style.css style/tokens.css favicon.svg assets/logo-mark.svg; do
            test -s "site/$file"
          done
          diff -u <(printf '%s\n' assets/logo-mark.svg dbom-view.js favicon.svg how-it-works.html index.html ots.js report.js style/style.css style/tokens.css trust-store.js ui.js v2b-text.js v2b.js verify.js) <(find site -type f | sed 's#^site/##' | sort)
          for src in $(grep -o 'src="[^"]*\.js"' index.html | sed 's/src="//; s/"$//'); do
            test -s "site/$src" || { echo "script référencé mais non publié : $src"; exit 1; }
          done
          test ! -e site/cli
          test ! -e site/tests
          # Publish the fingerprint of every served file, so an auditor can compare what the page runs (review V10)
          (cd site && find . -type f ! -name SHA256SUMS | sed 's#^\./##' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
          test -s site/SHA256SUMS
          cat site/SHA256SUMS
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4